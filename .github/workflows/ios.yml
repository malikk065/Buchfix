name: iPhone-App bauen (.ipa)

# Startet über den Knopf "Run workflow" im Tab Actions.
# Das Xcode-Projekt wird hier erzeugt — es muss nicht im Repository liegen.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  ipa:
    name: BuchFix.ipa
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Xcode-Projekt erzeugen
        run: |
          npx cap add ios || npx cap sync ios

      - name: App-Icon und Startbild einsetzen
        run: |
          ICONSET=ios/App/App/Assets.xcassets/AppIcon.appiconset
          SPLASH=ios/App/App/Assets.xcassets/Splash.imageset

          # Icon: fertige 1024er nehmen, sonst aus der groessten vorhandenen bauen.
          if [ -f www/icons/appicon-1024.png ]; then
            cp www/icons/appicon-1024.png "$ICONSET/AppIcon-512@2x.png"
            echo "1024er Icon uebernommen."
          elif [ -f www/icons/icon-512.png ]; then
            sips -z 1024 1024 www/icons/icon-512.png --out "$ICONSET/AppIcon-512@2x.png" >/dev/null
            echo "Icon aus icon-512.png hochgerechnet."
          else
            echo "Kein Icon gefunden - Capacitor-Standard bleibt."
          fi

          # Startbild ist optional. Fehlt es, bleibt der Standard.
          if [ -f www/icons/splash-2732.png ]; then
            cp www/icons/splash-2732.png "$SPLASH/splash-2732x2732.png"
            cp www/icons/splash-2732.png "$SPLASH/splash-2732x2732-1.png"
            [ -f www/icons/splash-2732-dark.png ] \
              && cp www/icons/splash-2732-dark.png "$SPLASH/splash-2732x2732-2.png"
            echo "Startbild uebernommen."
          else
            echo "Kein Startbild vorhanden - Standard bleibt."
          fi

      - name: Berechtigungen und Ausrichtung setzen
        run: |
          P=ios/App/App/Info.plist
          setze() {   # Schlüssel anlegen oder überschreiben
            /usr/libexec/PlistBuddy -c "Delete :$1" "$P" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :$1 $2 $3" "$P"
          }
          setze NSCameraUsageDescription string "Zum Fotografieren von Belegen und Rechnungen."
          setze NSPhotoLibraryUsageDescription string "Um gespeicherte Belegfotos auszuwählen."
          setze NSPhotoLibraryAddUsageDescription string "Um Rechnungen und Auswertungen als PDF zu sichern."
          setze ITSAppUsesNonExemptEncryption bool false
          setze UIFileSharingEnabled bool true
          setze LSSupportsOpeningDocumentsInPlace bool true
          setze CFBundleDevelopmentRegion string de
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$P" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$P"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$P"
          echo "--- Info.plist ---"; /usr/libexec/PlistBuddy -c "Print" "$P" | head -40

      - name: CocoaPods installieren
        working-directory: ios/App
        run: pod install --repo-update

      - name: App bauen
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: Platzhalter-Signatur setzen
        working-directory: ios/App
        run: |
          APP="build/App.xcarchive/Products/Applications/App.app"

          # Eingebettete Frameworks zuerst, von innen nach aussen.
          if [ -d "$APP/Frameworks" ]; then
            for F in "$APP/Frameworks"/*; do
              [ -e "$F" ] || continue
              codesign --force --sign - --timestamp=none "$F"
              echo "signiert: $(basename "$F")"
            done
          fi

          # Dann die App selbst.
          codesign --force --sign - --timestamp=none "$APP"

          echo "--- Ergebnis ---"
          codesign -dv "$APP" 2>&1 | head -8

      - name: .ipa packen
        working-directory: ios/App
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/

          # Ohne -y: Symlinks werden aufgeloest. Sonst stolpert iOS darueber.
          zip -qr BuchFix.ipa Payload -x "*.DS_Store"
          ls -lh BuchFix.ipa

          # Gegenprobe: liegt die App an der richtigen Stelle im Archiv?
          unzip -l BuchFix.ipa | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: BuchFix-ipa
          path: ios/App/BuchFix.ipa
          retention-days: 30
