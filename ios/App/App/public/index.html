}
async function exportSicherung() {
  const inhalt = JSON.stringify(S);
  const name = `BuchFix-Sicherung-${heute()}.json`;
  S.letzteSicherung = new Date().toISOString();
  speichern(true);
  /* Teilen-Menü, damit die Sicherung direkt in iCloud Drive landen kann. */
  try {
    const file = new File([inhalt], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      schliesseSheet(); toast("Sicherung erstellt"); return;
    }
  } catch (e) { if (e && e.name === "AbortError") { schliesseSheet(); return; } }
  datei(name, inhalt, "application/json");
  schliesseSheet();
}
function importieren() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const neu = JSON.parse(fr.result);
        if (!neu.version) throw new Error("kein BuchFix-Format");
        frage("Deine aktuellen Daten werden durch die Sicherung ersetzt.", "Einlesen", () => {
          S = Object.assign(leererStand(), neu);
          speichern(true); go("dashboard"); toast("Sicherung eingelesen");
        });
      } catch (e) { toast("Die Datei ist keine BuchFix-Sicherung."); }
    };
    fr.readAsText(f);
  };
  inp.click();
}

/* =====================================================================
   PDF-Erzeugung
   Erzeugt echte PDF-Dateien und öffnet das Teilen-Menü von iOS.
   Damit landet die Rechnung direkt in Mail, WhatsApp oder Dateien —
   ohne Umweg über den Druckdialog.
   ===================================================================== */
const PDF = {
  mm: v => v,
  L: 20, R: 190, // Seitenränder in mm
  neu() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "mm", format: "a4", compress: true });
    doc.setFont("helvetica", "normal");
    doc.setLanguage("de-DE");
    return doc;
  },
  /* Das Euro-Zeichen ist in der Standard-Kodierung nicht zuverlässig,
     deshalb im PDF ausgeschrieben. */
  geld(cents) { return zahl(cents) + " EUR"; },
  txt(doc, t, x, y, opt = {}) {
    doc.setFontSize(opt.size || 10);
    doc.setFont("helvetica", opt.bold ? "bold" : "normal");
    doc.setTextColor(opt.grau ? 110 : 25);
    doc.text(String(t ?? ""), x, y, { align: opt.align || "left" });
  },
  linie(doc, y, von, bis, stark) {
    doc.setDrawColor(stark ? 40 : 190);
    doc.setLineWidth(stark ? 0.5 : 0.2);
    doc.line(von ?? PDF.L, y, bis ?? PDF.R, y);
  },
  kopf(doc) {
    const p = S.profil || {};
    PDF.txt(doc, [p.firmenname, p.strasse, [p.plz, p.ort].filter(Boolean).join(" ")].filter(Boolean).join(" · "),
      PDF.L, 28, { size: 7.5, grau: true });
    PDF.linie(doc, 30);
  },
  empfaenger(doc, k, y) {
    if (!k) return y;
    const zeilen = [k.firma, k.firma && k.name !== k.firma ? k.name : (k.firma ? null : k.name),
      k.strasse, [k.plz, k.ort].filter(Boolean).join(" ")].filter(Boolean);
    zeilen.forEach((z, i) => PDF.txt(doc, z, PDF.L, y + i * 5, { size: 10.5 }));
    return y + zeilen.length * 5;
  },
  fuss(doc) {
    const p = S.profil || {};
    const y = 272;
    PDF.linie(doc, y);
    const sp = [
      [p.firmenname, p.strasse, [p.plz, p.ort].filter(Boolean).join(" ")],
      [p.telefon, p.email, p.website],
      [p.steuernummer ? "Steuernummer " + p.steuernummer : null,
       p.ustid ? "USt-IdNr. " + p.ustid : null,
       p.iban ? "IBAN " + p.iban : null,
       p.bic ? "BIC " + p.bic : null]
    ];
    sp.forEach((spalte, i) => {
      spalte.filter(Boolean).forEach((z, j) => {
        PDF.txt(doc, z, PDF.L + i * 57, y + 5 + j * 3.6, { size: 7, grau: true });
      });
    });
  },
  /* Positionstabelle mit Umbruch auf Folgeseiten */
  posten(doc, y, posten) {
    const sp = [PDF.L, 125, 148, PDF.R];
    PDF.txt(doc, "Beschreibung", sp[0], y, { size: 8, bold: true });
    PDF.txt(doc, "Menge", sp[1], y, { size: 8, bold: true, align: "right" });
    PDF.txt(doc, "Einzelpreis", sp[2] + 14, y, { size: 8, bold: true, align: "right" });
    PDF.txt(doc, "Betrag", sp[3], y, { size: 8, bold: true, align: "right" });
    y += 2; PDF.linie(doc, y, PDF.L, PDF.R, true); y += 5;

    posten.forEach(p => {
      doc.setFontSize(9.5); doc.setFont("helvetica", "normal");
      const text = doc.splitTextToSize(String(p.text || ""), 92);
      if (y + text.length * 4.4 > 252) { doc.addPage(); y = 30; }
      text.forEach((t, j) => PDF.txt(doc, t, sp[0], y + j * 4.4, { size: 9.5 }));
      PDF.txt(doc, nfNum.format(p.menge), sp[1], y, { size: 9.5, align: "right" });
      PDF.txt(doc, PDF.geld(p.preis), sp[2] + 14, y, { size: 9.5, align: "right" });
      PDF.txt(doc, PDF.geld(p.netto), sp[3], y, { size: 9.5, align: "right" });
      y += Math.max(1, text.length) * 4.4 + 3.4;
      PDF.linie(doc, y - 3);
    });
    return y + 2;
  },
  summen(doc, y, netto, ust, brutto, gruppen) {
    const x1 = 128, x2 = PDF.R;
    PDF.txt(doc, "Nettobetrag", x1, y, { size: 9.5, grau: true });
    PDF.txt(doc, PDF.geld(netto), x2, y, { size: 9.5, align: "right" });
    y += 5;
    (gruppen || []).forEach(g => {
      PDF.txt(doc, "zzgl. " + g.satz + " % USt", x1, y, { size: 9.5, grau: true });
      PDF.txt(doc, PDF.geld(g.ust), x2, y, { size: 9.5, align: "right" });
      y += 5;
    });
    PDF.linie(doc, y - 3, x1, x2, true);
    PDF.txt(doc, "Gesamtbetrag", x1, y + 1, { size: 11.5, bold: true });
    PDF.txt(doc, PDF.geld(brutto), x2, y + 1, { size: 11.5, bold: true, align: "right" });
    return y + 9;
  },
  absatz(doc, y, text, opt = {}) {
    const zeilen = doc.splitTextToSize(text, opt.breite || 170);
    zeilen.forEach((z, i) => {
      if (y + i * 4.3 > 262) { doc.addPage(); y = 30; }
      PDF.txt(doc, z, PDF.L, y + i * 4.3, { size: opt.size || 9, grau: opt.grau !== false, bold: opt.bold });
    });
    return y + zeilen.length * 4.3 + 3;
  },
  /* Teilen statt Download: auf dem iPhone öffnet das das normale Teilen-Menü. */
  async ausgeben(doc, dateiname) {
    const blob = doc.output("blob");
    const file = new File([blob], dateiname, { type: "application/pdf" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: dateiname }); return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = dateiname;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
    toast("PDF gesichert");
  }
};

function pdfVerfuegbar() { return !!(window.jspdf && window.jspdf.jsPDF); }

function druckeRechnung(id) {
  if (!pdfVerfuegbar()) return druckansichtRechnung(id);
  const r = S.rechnungen.find(x => x.id === id), k = kunde(r.kundeId), p = S.profil || {};
  const doc = PDF.neu();
  PDF.kopf(doc);
  let y = PDF.empfaenger(doc, k, 45);
  y = Math.max(y, 70);

  PDF.txt(doc, "Rechnung " + r.nummer, PDF.L, y + 12, { size: 16, bold: true });
  const rechts = [
    ["Rechnungsdatum", dText(r.datum)],
    ["Leistungsdatum", dText(r.leistungsdatum)],
    k && k.nummer ? ["Kundennummer", k.nummer] : null,
    ["Zahlbar bis", dText(r.faellig)]
  ].filter(Boolean);
  rechts.forEach((z, i) => {
    PDF.txt(doc, z[0], 148, y + 4 + i * 4.4, { size: 8.5, grau: true });
    PDF.txt(doc, z[1], PDF.R, y + 4 + i * 4.4, { size: 8.5, align: "right" });
  });
  y += 22;

  y = PDF.posten(doc, y, r.posten);
  const gruppen = r.ust ? [{ satz: r.posten[0]?.satz || 19, ust: r.ust }] : [];
  y = PDF.summen(doc, y + 3, r.netto, r.ust, r.brutto, gruppen);

  if (r.kleinunternehmer) y = PDF.absatz(doc, y + 2, "Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.");
  if (r.notiz) y = PDF.absatz(doc, y + 1, r.notiz);
  y = PDF.absatz(doc, y + 1,
    "Bitte überweise den Betrag bis zum " + dText(r.faellig) +
    (p.iban ? " auf das Konto " + p.iban : "") + "." +
    (r.ausAngebot ? " Grundlage: Angebot " + r.ausAngebot + "." : ""));
  PDF.fuss(doc);
  PDF.ausgeben(doc, "Rechnung-" + r.nummer + ".pdf");
}

function druckeAngebot(id) {
  if (!pdfVerfuegbar()) return druckansichtAngebot(id);
  const a = S.angebote.find(x => x.id === id), k = kunde(a.kundeId);
  const doc = PDF.neu();
  PDF.kopf(doc);
  let y = Math.max(PDF.empfaenger(doc, k, 45), 70);
  PDF.txt(doc, "Angebot " + a.nummer, PDF.L, y + 12, { size: 16, bold: true });
  [["Datum", dText(a.datum)], ["Gültig bis", dText(a.gueltigBis)]].forEach((z, i) => {
    PDF.txt(doc, z[0], 148, y + 4 + i * 4.4, { size: 8.5, grau: true });
    PDF.txt(doc, z[1], PDF.R, y + 4 + i * 4.4, { size: 8.5, align: "right" });
  });
  y += 22;
  y = PDF.posten(doc, y, a.posten);
  y = PDF.summen(doc, y + 3, a.netto, a.ust, a.brutto, a.ust ? [{ satz: a.posten[0]?.satz || 19, ust: a.ust }] : []);
  if (a.kleinunternehmer) y = PDF.absatz(doc, y + 2, "Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.");
  if (a.notiz) y = PDF.absatz(doc, y + 1, a.notiz);
  PDF.absatz(doc, y + 1, "Dieses Angebot ist bis zum " + dText(a.gueltigBis) + " gültig. Über deinen Auftrag freue ich mich.");
  PDF.fuss(doc);
  PDF.ausgeben(doc, "Angebot-" + a.nummer + ".pdf");
}

function druckeEuer() {
  if (!pdfVerfuegbar()) return druckansichtEuer();
  const [v, b] = zeitraumJahr(euerJahr);
  const ein = einnahmenIn(v, b), aus = ausgabenIn(v, b);
  const eg = gruppiere(ein, e => katName(e.kategorieId), e => e.netto);
  const ag = gruppiere(aus, a => katName(a.kategorieId), a => abzugsfaehig(a));
  const sE = eg.reduce((s, x) => s + x.wert, 0), sA = ag.reduce((s, x) => s + x.wert, 0);
  const p = S.profil || {};
  const doc = PDF.neu();
  PDF.kopf(doc);
  PDF.txt(doc, "Einnahmen-Überschuss-Rechnung " + euerJahr, PDF.L, 44, { size: 15, bold: true });
  PDF.txt(doc, [p.firmenname, p.steuernummer ? "Steuernummer " + p.steuernummer : null].filter(Boolean).join(" · "),
    PDF.L, 50, { size: 9, grau: true });

  let y = 62;
  const block = (titel, zeilen, summe) => {
    PDF.txt(doc, titel, PDF.L, y, { size: 10.5, bold: true });
    PDF.txt(doc, "Betrag", PDF.R, y, { size: 8, bold: true, align: "right" });
    y += 2; PDF.linie(doc, y, PDF.L, PDF.R, true); y += 5.5;
    (zeilen.length ? zeilen : [{ name: "Keine Buchungen erfasst", wert: 0 }]).forEach(z => {
      if (y > 250) { doc.addPage(); y = 30; }
      PDF.txt(doc, z.name, PDF.L, y, { size: 9.5 });
      PDF.txt(doc, PDF.geld(z.wert), PDF.R, y, { size: 9.5, align: "right" });
      y += 5.0; PDF.linie(doc, y - 3.2);
    });
    y += 1.5;
    PDF.txt(doc, "Summe", PDF.L, y + 2, { size: 10, bold: true });
    PDF.txt(doc, PDF.geld(summe), PDF.R, y + 2, { size: 10, bold: true, align: "right" });
    y += 12;
  };
  block("Betriebseinnahmen", eg, sE);
  block("Betriebsausgaben", ag, sA);

  PDF.linie(doc, y - 4, PDF.L, PDF.R, true);
  PDF.txt(doc, "Vorläufiger Gewinn", PDF.L, y + 2, { size: 12.5, bold: true });
  PDF.txt(doc, PDF.geld(sE - sA), PDF.R, y + 2, { size: 12.5, bold: true, align: "right" });
  y += 12;

  if (!kleinunternehmer()) {
    const ustEin = ein.reduce((s, e) => s + (e.ust || 0), 0);
    const vst = aus.reduce((s, a) => s + vorsteuerVon(a), 0);
    y = PDF.absatz(doc, y, "Umsatzsteuer: vereinnahmt " + PDF.geld(ustEin) + ", gezahlte Vorsteuer " +
      PDF.geld(vst) + ", Zahllast " + PDF.geld(ustEin - vst) + ".", { grau: false });
  }
  y = PDF.absatz(doc, y + 2, "Privatanteile sind abgezogen, Bewirtungskosten mit 70 % angesetzt (§ 4 Abs. 5 Nr. 2 EStG).");
  PDF.absatz(doc, y, HINWEIS_EUER);
  PDF.fuss(doc);
  PDF.ausgeben(doc, "EUER-" + euerJahr + ".pdf");
}

function druckeEks(pid) {
  if (!pdfVerfuegbar()) return druckansichtEks(pid);
  const p = S.eks.find(x => x.id === pid);
  const ms = eksMonate(p);
  const sE = ms.reduce((s, m) => s + m.ein, 0), sA = ms.reduce((s, m) => s + m.aus, 0);
  const pr = S.profil || {};
  const doc = PDF.neu();
  PDF.kopf(doc);
  PDF.txt(doc, "Anlage EKS — Vorbereitung", PDF.L, 44, { size: 15, bold: true });

  let y = 54;
  [[pr.firmenname, ""], [(pr.vorname || "") + " " + (pr.nachname || ""), ""], [pr.gewerbeart || "", ""]]
    .filter(z => z[0].trim()).forEach((z, i) => PDF.txt(doc, z[0], PDF.L, y + i * 4.4, { size: 9.5 }));
  PDF.txt(doc, "Bewilligungszeitraum", PDF.R, 54, { size: 8.5, grau: true, align: "right" });
  PDF.txt(doc, dText(p.von) + " – " + dText(p.bis), PDF.R, 58.5, { size: 10, bold: true, align: "right" });
  PDF.txt(doc, p.modus === "vorlaeufig" ? "Vorläufige Angaben (Schätzung)" : "Abschließende Angaben",
    PDF.R, 63, { size: 8.5, grau: true, align: "right" });
  y = 78;

  const spalten = [PDF.L, 105, 140, PDF.R];
  ["Monat", "Betriebseinnahmen", "Betriebsausgaben", "Gewinn"].forEach((t, i) =>
    PDF.txt(doc, t, spalten[i], y, { size: 8, bold: true, align: i ? "right" : "left" }));
  y += 2; PDF.linie(doc, y, PDF.L, PDF.R, true); y += 5.5;

  ms.forEach(m => {
    if (y > 245) { doc.addPage(); y = 30; }
    PDF.txt(doc, m.name + " " + m.jahr, spalten[0], y, { size: 9.5 });
    PDF.txt(doc, PDF.geld(m.ein), spalten[1], y, { size: 9.5, align: "right" });
    PDF.txt(doc, PDF.geld(m.aus), spalten[2], y, { size: 9.5, align: "right" });
    PDF.txt(doc, PDF.geld(m.gewinn), spalten[3], y, { size: 9.5, align: "right" });
    y += 5.2; PDF.linie(doc, y - 3.4);
  });

  y += 2; PDF.linie(doc, y - 1, PDF.L, PDF.R, true); y += 4;
  PDF.txt(doc, "Summe", spalten[0], y, { size: 10, bold: true });
  PDF.txt(doc, PDF.geld(sE), spalten[1], y, { size: 10, bold: true, align: "right" });
  PDF.txt(doc, PDF.geld(sA), spalten[2], y, { size: 10, bold: true, align: "right" });
  PDF.txt(doc, PDF.geld(sE - sA), spalten[3], y, { size: 10, bold: true, align: "right" });
  y += 5.5;
  PDF.txt(doc, "Monatlicher Durchschnitt", spalten[0], y, { size: 9.5, grau: true });
  PDF.txt(doc, PDF.geld(rnd(sE / ms.length)), spalten[1], y, { size: 9.5, align: "right" });
  PDF.txt(doc, PDF.geld(rnd(sA / ms.length)), spalten[2], y, { size: 9.5, align: "right" });
  PDF.txt(doc, PDF.geld(rnd((sE - sA) / ms.length)), spalten[3], y, { size: 9.5, align: "right" });
  y += 12;

  y = PDF.absatz(doc, y, HINWEIS_EKS, { bold: false, grau: false });
  y = PDF.absatz(doc, y, p.modus === "vorlaeufig"
    ? "Die Werte beruhen auf einer Schätzung des Antragstellers."
    : "Die Werte beruhen auf den tatsächlich verbuchten Einnahmen und Ausgaben im genannten Zeitraum.");
  y += 8;
  PDF.linie(doc, y + 2, PDF.L, 95);
  PDF.txt(doc, "Ort, Datum", PDF.L, y + 6.5, { size: 8.5, grau: true });
  PDF.linie(doc, y + 2, 115, PDF.R);
  PDF.txt(doc, "Unterschrift", 115, y + 6.5, { size: 8.5, grau: true });
  PDF.fuss(doc);
  PDF.ausgeben(doc, "EKS-" + p.von + "-bis-" + p.bis + ".pdf");
}


/* =====================================================================
   ABGLEICH MIT DER DATENBANK

   Die App bleibt zuerst lokal: alles wird sofort auf dem Gerät
   gespeichert und funktioniert ohne Netz. Der Abgleich läuft im
   Hintergrund und schiebt Änderungen hoch und runter.

   Bei gleichzeitigen Änderungen auf zwei Geräten gewinnt die zuletzt
   gespeicherte Version. Für einen Ein-Personen-Betrieb ist das die
   richtige Abwägung — ein echter Konfliktdialog wäre hier nur im Weg.
   ===================================================================== */
const Cloud = {
  client: null,
  nutzer: null,
  laeuft: false,
  fehler: null,

  /* Welche Liste gehört zu welcher Tabelle, und wie heißen die Felder. */
  tabellen: {
    kategorien: { liste: "kategorien", felder: { id: "id", name: "name", art: "art", bewirtung: "bewirtung", system: "system" } },
    kunden: { liste: "kunden", felder: { id: "id", name: "name", firma: "firma", strasse: "strasse", plz: "plz", ort: "ort", email: "email", telefon: "telefon", nummer: "kundennummer", notizen: "notizen" } },
    rechnungen: { liste: "rechnungen", felder: { id: "id", kundeId: "kunde_id", nummer: "nummer", status: "status", datum: "datum", leistungsdatum: "leistungsdatum", faellig: "faellig", netto: "netto_cents", ust: "ust_cents", brutto: "brutto_cents", bezahlt: "bezahlt_cents", bezahltAm: "bezahlt_am", kleinunternehmer: "kleinunternehmer", mahnstufe: "mahnstufe", letzteMahnung: "letzte_mahnung", ausAngebot: "aus_angebot", notiz: "notiz", posten: "posten" } },
    angebote: { liste: "angebote", felder: { id: "id", kundeId: "kunde_id", nummer: "nummer", status: "status", datum: "datum", gueltigBis: "gueltig_bis", netto: "netto_cents", ust: "ust_cents", brutto: "brutto_cents", kleinunternehmer: "kleinunternehmer", rechnungId: "rechnung_id", notiz: "notiz", posten: "posten" } },
    einnahmen: { liste: "einnahmen", felder: { id: "id", kundeId: "kunde_id", rechnungId: "rechnung_id", kategorieId: "kategorie_id", datum: "datum", bezahltAm: "bezahlt_am", beschreibung: "beschreibung", netto: "netto_cents", ust: "ust_cents", brutto: "brutto_cents", ustSatz: "ust_satz", zahlart: "zahlart", status: "status", rechnungsnummer: "rechnungsnummer", notiz: "notiz" } },
    ausgaben: { liste: "ausgaben", felder: { id: "id", kategorieId: "kategorie_id", datum: "datum", bezahltAm: "bezahlt_am", haendler: "haendler", beschreibung: "beschreibung", netto: "netto_cents", ust: "ust_cents", brutto: "brutto_cents", ustSatz: "ust_satz", privatanteil: "privatanteil", zahlart: "zahlart", notiz: "notiz" } },
    belege: { liste: "belege", felder: { id: "id", ausgabeId: "ausgabe_id", pfad: "pfad", haendler: "haendler", datum: "datum" } },
    eks: { liste: "eks", felder: { id: "id", von: "von", bis: "bis", modus: "modus", frist: "frist", monate: "monate" } },
    regeln: { liste: "regeln", felder: { id: "id", muster: "muster", kategorieId: "kategorie_id", treffer: "treffer" } }
  },

  eingerichtet() {
    const c = window.BUCHFIX_CONFIG || {};
    return !!(c.SUPABASE_URL && c.SUPABASE_ANON_KEY && window.supabase);
  },

  async start() {
    if (!this.eingerichtet()) return false;
    const c = window.BUCHFIX_CONFIG;
    this.client = window.supabase.createClient(c.SUPABASE_URL, c.SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, storageKey: "buchfix-auth" }
    });
    const { data } = await this.client.auth.getSession();
    this.nutzer = data && data.session ? data.session.user : null;
    this.client.auth.onAuthStateChange((_e, sitzung) => {
      this.nutzer = sitzung ? sitzung.user : null;
    });
    return !!this.nutzer;
  },

  async registrieren(email, passwort) {
    const { data, error } = await this.client.auth.signUp({ email, password: passwort });
    if (error) throw new Error(uebersetze(error.message));
    this.nutzer = data.user;
    return data;
  },
  async anmelden(email, passwort) {
    const { data, error } = await this.client.auth.signInWithPassword({ email, password: passwort });
    if (error) throw new Error(uebersetze(error.message));
    this.nutzer = data.user;
    return data;
  },
  async passwortVergessen(email) {
    const { error } = await this.client.auth.resetPasswordForEmail(email, { redirectTo: location.href });
    if (error) throw new Error(uebersetze(error.message));
  },
  async abmelden() {
    await this.client.auth.signOut();
    this.nutzer = null;
  },

  /* --------- Umrechnung lokal <-> Datenbank --------- */
  nachDb(name, obj) {
    const f = this.tabellen[name].felder, out = { user_id: this.nutzer.id };
    for (const [lokal, db] of Object.entries(f)) {
      let v = obj[lokal];
      if (v === undefined) v = null;
      if (v === "" && db !== "name" && db !== "haendler") v = null;
      out[db] = v;
    }
    return out;
  },
  nachLokal(name, zeile) {
    const f = this.tabellen[name].felder, out = {};
    for (const [lokal, db] of Object.entries(f)) {
      let v = zeile[db];
      if (typeof v === "string" && /^\d+$/.test(v) && ["netto", "ust", "brutto", "bezahlt"].includes(lokal)) v = Number(v);
      out[lokal] = v === null ? (typeof out[lokal] === "number" ? 0 : null) : v;
    }
    ["netto", "ust", "brutto", "bezahlt", "ustSatz", "privatanteil", "mahnstufe", "treffer"].forEach(k => {
      if (out[k] !== undefined && out[k] !== null) out[k] = Number(out[k]);
    });
    return out;
  },

  fingerabdruck(obj) {
    const kopie = { ...obj };
    delete kopie.bild;            // Belegfoto liegt im Speicher, nicht in der Zeile
    return JSON.stringify(kopie);
  },

  /* --------- Der eigentliche Abgleich --------- */
  async abgleichen(still) {
    if (!this.nutzer || this.laeuft) return false;
    if (!navigator.onLine) { if (!still) toast("Kein Netz — wird später abgeglichen"); return false; }
    this.laeuft = true; this.fehler = null;
    statusAnzeigen();
    try {
      S.syncHashes = S.syncHashes || {};
      S.geloescht = S.geloescht || [];
      const seit = S.letzterAbgleich || "1970-01-01T00:00:00Z";

      await this.profilAbgleichen();
      await this.belegeHochladen();

      for (const [name, def] of Object.entries(this.tabellen)) {
        await this.tabelleAbgleichen(name, def, seit);
      }
      await this.loeschungenSenden();

      S.letzterAbgleich = new Date().toISOString();
      await speichern(true);
      if (!still) toast("Abgeglichen");
      render();
      return true;
    } catch (e) {
      this.fehler = e.message || String(e);
      if (!still) toast("Abgleich fehlgeschlagen: " + this.fehler);
      return false;
    } finally {
      this.laeuft = false;
      statusAnzeigen();
    }
  },

  async tabelleAbgleichen(name, def, seit) {
    const liste = S[def.liste] || [];

    /* 1. Was der Server seit dem letzten Mal Neues hat */
    const { data: fremd, error } = await this.client
      .from(name).select("*").gt("updated_at", seit);
    if (error) throw error;

    const geloeschteIds = new Set((S.geloescht || []).filter(g => g.liste === def.liste).map(g => g.id));

    (fremd || []).forEach(zeile => {
      const idx = liste.findIndex(x => x.id === zeile.id);
      if (zeile.geloescht_am) {
        if (idx >= 0) liste.splice(idx, 1);
        return;
      }
      if (geloeschteIds.has(zeile.id)) return;     // hier gelöscht, Löschung geht gleich raus
      const lokalGeaendert = idx >= 0 &&
        this.hash(name, liste[idx]) !== (S.syncHashes[name] || {})[zeile.id];
      if (idx >= 0 && lokalGeaendert) return;      // lokale Änderung hat Vorrang, wird gepusht
      const neu = this.nachLokal(name, zeile);
      if (idx >= 0) liste[idx] = { ...liste[idx], ...neu };
      else liste.push(neu);
      this.hashMerken(name, neu);
    });

    /* 2. Was hier geändert wurde */
    const vorher = S.syncHashes[name] || {};
    const zuSenden = liste.filter(o => this.fingerabdruck(o) !== vorher[o.id]);
    for (let i = 0; i < zuSenden.length; i += 200) {
      const teil = zuSenden.slice(i, i + 200).map(o => this.nachDb(name, o));
      const { error: e2 } = await this.client.from(name).upsert(teil, { onConflict: "id" });
      if (e2) throw e2;
    }
    zuSenden.forEach(o => this.hashMerken(name, o));
  },

  hash(name, obj) { return this.fingerabdruck(obj); },
  hashMerken(name, obj) {
    S.syncHashes[name] = S.syncHashes[name] || {};
    S.syncHashes[name][obj.id] = this.fingerabdruck(obj);
  },

  async loeschungenSenden() {
    const offen = S.geloescht || [];
    if (!offen.length) return;
    const zeit = new Date().toISOString();
    for (const g of offen) {
      const name = Object.keys(this.tabellen).find(n => this.tabellen[n].liste === g.liste);
      if (!name) continue;
      await this.client.from(name).update({ geloescht_am: zeit }).eq("id", g.id);
      if (S.syncHashes[name]) delete S.syncHashes[name][g.id];
    }
    S.geloescht = [];
  },

  async profilAbgleichen() {
    const { data, error } = await this.client.from("profile").select("*").maybeSingle();
    if (error && error.code !== "PGRST116") throw error;
    const lokalStand = S.profilStand || 0;
    if (data && new Date(data.updated_at).getTime() > lokalStand && !S.profilGeaendert) {
      S.profil = data.daten;
      S.zaehler = data.zaehler || {};
    } else if (S.profil) {
      const { error: e2 } = await this.client.from("profile")
        .upsert({ user_id: this.nutzer.id, daten: S.profil, zaehler: S.zaehler }, { onConflict: "user_id" });
      if (e2) throw e2;
      S.profilGeaendert = false;
    }
    S.profilStand = Date.now();
  },

  /* Belegfotos wandern in den privaten Speicher, nicht in die Tabelle. */
  async belegeHochladen() {
    for (const b of S.belege) {
      if (b.pfad || !b.bild || !b.bild.startsWith("data:")) continue;
      const pfad = `${this.nutzer.id}/${b.id}.jpg`;
      const blob = await (await fetch(b.bild)).blob();
      const { error } = await this.client.storage.from("belege")
        .upload(pfad, blob, { contentType: "image/jpeg", upsert: true });
      if (error) throw error;
      b.pfad = pfad;
    }
  },

  /* Fotos, die nur auf dem Server liegen, bei Bedarf sichtbar machen. */
  async belegBild(b) {
    if (b.bild) return b.bild;
    if (!b.pfad || !this.nutzer) return null;
    const { data, error } = await this.client.storage.from("belege").createSignedUrl(b.pfad, 3600);
    if (error) return null;
    return data.signedUrl;
  },

  async kontoLoeschen() {
    for (const b of S.belege) if (b.pfad) await this.client.storage.from("belege").remove([b.pfad]);
    for (const name of Object.keys(this.tabellen)) await this.client.from(name).delete().neq("id", "00000000-0000-0000-0000-000000000000");
    await this.client.from("profile").delete().eq("user_id", this.nutzer.id);
  }
};

/* ===================== SPEICHER ABSICHERN =====================
   iOS räumt Browser-Daten auf, wenn der Platz knapp wird. Mit
   navigator.storage.persist() markieren wir die Daten als wichtig.
   Vom Home-Bildschirm gestartete Apps sind ohnehin von der
   7-Tage-Regel ausgenommen — das hier ist der zweite Gürtel.
   ============================================================= */
async function speicherSchuetzen() {
  try {
    if (navigator.storage && navigator.storage.persist) {
      const schon = await navigator.storage.persisted();
      if (!schon) await navigator.storage.persist();
    }
  } catch (e) {}
}

async function speicherInfo() {
  try {
    const geschuetzt = navigator.storage && navigator.storage.persisted
      ? await navigator.storage.persisted() : false;
    let belegt = null, frei = null;
    if (navigator.storage && navigator.storage.estimate) {
      const e = await navigator.storage.estimate();
      belegt = e.usage; frei = e.quota;
    }
    return { geschuetzt, belegt, frei };
  } catch (e) { return { geschuetzt: false, belegt: null, frei: null }; }
}

function tageSeitSicherung() {
  if (!S.letzteSicherung) return null;
  return Math.floor((Date.now() - new Date(S.letzteSicherung).getTime()) / 86400000);
}

/* Erinnert ans Sichern, wenn Daten da sind und länger nichts gesichert wurde. */
function sicherungPruefen() {
  const hatDaten = S.einnahmen.length + S.ausgaben.length + S.rechnungen.length + S.belege.length > 0;
  if (!hatDaten) return;
  if (Cloud.nutzer && S.letzterAbgleich) return;   // liegt schon in der Datenbank
  const t = tageSeitSicherung();
  if (t !== null && t < 14) return;
  if (sessionStorage.getItem("bf_sicherung") === "zu") return;
  const el = document.createElement("div");
  el.className = "installbar";
  el.innerHTML = `<span>${t === null
    ? "Du hast noch nie gesichert. Ohne Sicherung sind deine Daten bei Geräteverlust weg."
    : "Letzte Sicherung vor " + t + " Tagen."}</span>
    <button class="btn sm" id="bfSich">Sichern</button>
    <button class="iconbtn" id="bfSichZu" aria-label="Schließen">✕</button>`;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add("on"));
  const zu = () => { el.classList.remove("on"); sessionStorage.setItem("bf_sicherung", "zu"); setTimeout(() => el.remove(), 300); };
  el.querySelector("#bfSichZu").onclick = zu;
  el.querySelector("#bfSich").onclick = () => { zu(); exportSicherung(); };
}

function installiert() {
  return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
}
function istIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}

let installEvent = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvent = e; });

/* Einmaliger Hinweis, wie die App auf den Home-Bildschirm kommt. */
function installBanner() {
  if (installiert() || sessionStorage.getItem("bf_banner") === "zu") return;

    ? `<span>BuchFix als App installieren</span><button class="btn sm" id="bfInst">Installieren</button><button class="iconbtn" id="bfZu" aria-label="Schließen">✕</button>`
    : istIOS()
      ? `<span>Teilen-Symbol antippen, dann „Zum Home-Bildschirm“ — dann läuft BuchFix wie eine App.</span><button class="iconbtn" id="bfZu" aria-label="Schließen">✕</button>`

/* Service Worker: macht die App offline lauffähig und meldet Updates. */
function serviceWorkerStarten() {
  if (!("serviceWorker" in navigator) || location.protocol === "file:") return;
  navigator.serviceWorker.register("sw.js").then(reg => {
    reg.addEventListener("updatefound", () => {
      const neu = reg.installing;
      neu && neu.addEventListener("statechange", () => {
        if (neu.state === "installed" && navigator.serviceWorker.controller) {
          toast("Neue Version bereit — App neu starten");
        }
      });
    });
  }).catch(() => {});
}

/* Schnellaktionen vom Home-Bildschirm (langer Druck aufs Icon) */
function schnellstart() {
  const was = new URLSearchParams(location.search).get("neu");
  if (!was || !S.profil) return;
  history.replaceState(null, "", location.pathname);
  setTimeout(() => {
    if (was === "ausgabe") neueAusgabe();
    else if (was === "beleg") neuerBeleg();
    else if (was === "rechnung") neueRechnung();
    else if (was === "einnahme") neueEinnahme();
  }, 400);
}

(async function start() {
  await ladeStand();
  document.documentElement.dataset.theme = S.theme || "light";
  baueTabs();
  document.getElementById("fab").onclick = fabAktion;
  document.getElementById("btnTheme").onclick = themeWechseln;
  document.getElementById("btnSearch").onclick = suche;
  document.getElementById("sheetClose").onclick = schliesseSheet;
  document.getElementById("sheetBg").onclick = schliesseSheet;
  window.addEventListener("scroll", () => {
    document.getElementById("topbar").classList.toggle("scrolled", window.scrollY > 6);
  }, { passive: true });
  window.addEventListener("beforeunload", () => { if (saveTimer) { clearTimeout(saveTimer); Storage.set(KEY, JSON.stringify(S)); } });
  render();
  pruefeHinweise();
  serviceWorkerStarten();
  schnellstart();
  speicherSchuetzen();
  Cloud.start().then(angemeldet => {
    statusAnzeigen();
    if (angemeldet) Cloud.abgleichen(true);
    render();
  });
  window.addEventListener("online", () => Cloud.abgleichen(true));
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") Cloud.abgleichen(true);
  });
  setTimeout(installBanner, 2500);
  setTimeout(sicherungPruefen, 5000);
  if (installiert()) document.documentElement.classList.add("app");
})();
</script>
